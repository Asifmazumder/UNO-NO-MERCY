<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>
UNO NO MERCY — ASIF M EDITION
</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #30130d;

    color: white;
}

/* =====================================================
   HOME
===================================================== */

#home {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at center,
            #8d4228,
            #40190f 70%
        );
}

.home-box {

    width:
        min(440px, 100%);

    padding: 30px;

    text-align: center;

    border-radius: 28px;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid
        rgba(255,255,255,.15);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.5);

    backdrop-filter:
        blur(15px);
}

.logo {

    font-size:
        clamp(55px, 15vw, 100px);

    font-weight:
        1000;

    line-height:
        .8;

    color:
        #ffdf00;

    text-shadow:
        5px 5px 0 #d90000,
        0 0 30px #ff6600;
}

.no-mercy {

    margin-top: 15px;

    font-size: 18px;

    font-weight: 1000;

    letter-spacing: 5px;
}

.asif-edition {

    margin-top: 7px;

    color:
        #ff9c78;

    font-size: 12px;

    letter-spacing: 2px;

    font-weight: 900;
}

.home-buttons {

    display:
        grid;

    gap: 12px;

    margin-top: 35px;
}

.main-btn {

    width: 100%;

    padding:
        17px;

    border: none;

    border-radius:
        15px;

    font-weight:
        1000;

    font-size:
        16px;

    cursor:
        pointer;

    color:
        #30130d;

    background:
        #ffdf00;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.3);

    transition:
        .2s;
}

.main-btn:active {

    transform:
        scale(.95);
}

.secondary-btn {

    background:
        rgba(255,255,255,.12);

    color:
        white;

    border:
        1px solid
        rgba(255,255,255,.2);
}

.join-area {

    display:
        none;

    margin-top:
        15px;
}

.join-area.show {

    display:
        block;
}

input {

    width:
        100%;

    padding:
        15px;

    border:
        1px solid
        rgba(255,255,255,.2);

    border-radius:
        13px;

    outline:
        none;

    background:
        #150b08;

    color:
        white;

    font-size:
        16px;

    text-align:
        center;
}

footer {

    margin-top:
        25px;

    color:
        #ad7665;

    font-size:
        12px;
}

/* =====================================================
   NAME MODAL
===================================================== */

.modal {

    position:
        fixed;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(0,0,0,.8);

    backdrop-filter:
        blur(10px);

    z-index:
        99999;
}

.modal.hidden {

    display:
        none;
}

.modal-box {

    width:
        min(400px,100%);

    padding:
        30px;

    border-radius:
        25px;

    background:
        #24100b;

    border:
        1px solid
        #ffffff25;

    box-shadow:
        0 30px 100px #000;

    text-align:
        center;
}

.modal-box h2 {

    margin-top:
        0;

    color:
        #ffdf00;
}

.modal-box button {

    margin-top:
        12px;

    width:
        100%;
}

/* =====================================================
   LOBBY
===================================================== */

#lobby {

    position:
        fixed;

    inset:
        0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        radial-gradient(
            circle,
            #71341f,
            #2d110a
        );
}

#lobby.hidden {

    display:
        none;
}

.lobby-box {

    width:
        min(600px,100%);

    text-align:
        center;

    padding:
        30px;

    border-radius:
        25px;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(15px);
}

.room-code {

    margin:
        15px;

    font-size:
        52px;

    letter-spacing:
        10px;

    color:
        #ffdf00;

    font-weight:
        1000;

    text-shadow:
        0 5px 20px #000;
}

.players {

    display:
        grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:
        10px;

    margin:
        25px 0;
}

.player-box {

    padding:
        15px 8px;

    border-radius:
        15px;

    background:
        #ffffff10;

    border:
        1px solid
        #ffffff15;
}

.player-box.host {

    border-color:
        #ffdf00;

    box-shadow:
        0 0 20px
        #ffdf0030;
}

/* =====================================================
   GAME
===================================================== */

#game {

    position:
        fixed;

    inset:
        0;

    overflow:
        hidden;

    background:
        radial-gradient(
            circle at center,
            #934629 0%,
            #692d1b 45%,
            #32120c 100%
        );
}

#game.hidden {

    display:
        none;
}

/* moving light */

#game::before {

    content:
        "";

    position:
        absolute;

    width:
        700px;

    height:
        700px;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:
        radial-gradient(
            circle,
            rgba(255,160,100,.18),
            transparent 65%
        );

    animation:
        glow 5s ease-in-out infinite;
}

@keyframes glow {

    0%,
    100% {
        transform:
            translate(-50%,-50%)
            scale(.9);
    }

    50% {
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }
}

/* =====================================================
   TOP BAR
===================================================== */

.game-topbar {

    position:
        absolute;

    top:
        18px;

    left:
        18px;

    right:
        18px;

    z-index:
        100;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.round-btn {

    width:
        58px;

    height:
        58px;

    border:
        none;

    border-radius:
        50%;

    background:
        white;

    color:
        #ce8baa;

    font-size:
        38px;

    font-weight:
        900;

    box-shadow:
        0 8px 25px #0006;

    cursor:
        pointer;

    transition:
        .2s;
}

.round-btn:active {

    transform:
        scale(.85)
        rotate(-10deg);
}

.game-title {

    text-align:
        center;
}

.game-title b {

    display:
        block;

    font-size:
        28px;

    color:
        #ffdf00;

    text-shadow:
        3px 3px #d00000;
}

.game-title span {

    font-size:
        9px;

    letter-spacing:
        3px;

    font-weight:
        1000;
}

/* =====================================================
   TABLE
===================================================== */

.table {

    position:
        absolute;

    inset:
        0;
}

/* CENTER */

.table-center {

    position:
        absolute;

    width:
        min(76vw,540px);

    height:
        min(76vw,540px);

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    background:
        radial-gradient(
            circle,
            #9b492a,
            #76311e 70%,
            #5c2417
        );

    border:
        7px solid
        #a85636;

    box-shadow:

        inset 0 0 0 3px #542014,

        inset 0 0 50px #351009,

        0 25px 70px #0009;
}

.table-center::before {

    content:
        "";

    position:
        absolute;

    inset:
        16px;

    border:
        2px solid
        rgba(255,180,130,.25);

    border-radius:
        50%;
}

.turn-ring {

    position:
        absolute;

    inset:
        28px;

    border:
        5px dashed
        rgba(255,190,130,.28);

    border-radius:
        50%;

    animation:
        rotate 12s linear infinite;
}

@keyframes rotate {

    to {
        transform:
            rotate(360deg);
    }
}

/* =====================================================
   PLAYERS
===================================================== */

.player {

    position:
        absolute;

    z-index:
        20;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}

.player-name {

    padding:
        10px 24px;

    border-radius:
        12px;

    background:
        #b86545;

    box-shadow:
        0 8px 20px #0005;

    font-weight:
        1000;

    font-size:
        18px;
}

.player-top {

    top:
        90px;

    left:
        50%;

    transform:
        translateX(-50%);

    flex-direction:
        column;
}

.player-left {

    left:
        -15px;

    top:
        50%;

    transform:
        translateY(-50%)
        rotate(90deg);
}

.player-right {

    right:
        -15px;

    top:
        50%;

    transform:
        translateY(-50%)
        rotate(-90deg);
}

.player-you {

    left:
        50%;

    bottom:
        0;

    transform:
        translateX(-50%);

    flex-direction:
        column;
}

.you-text {

    color:
        #ff976f;

    font-size:
        25px;

    font-weight:
        1000;

    letter-spacing:
        2px;

    margin-bottom:
        6px;

    text-shadow:
        0 4px 10px #000;
}

/* =====================================================
   PLAYER HAND BACK
===================================================== */

.enemy-hand {

    display:
        flex;

    justify-content:
        center;

    height:
        80px;

    margin-top:
        -5px;
}

.enemy-card {

    width:
        45px;

    height:
        65px;

    margin-left:
        -12px;

    border:
        3px solid white;

    border-radius:
        10px;

    background:
        linear-gradient(
            135deg,
            #292929,
            #81716b
        );

    box-shadow:
        0 5px 10px #0008;
}

/* =====================================================
   PILES
===================================================== */

.piles {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%,-50%);

    display:
        flex;

    align-items:
        center;

    gap:
        30px;
}

.draw-pile,
.discard-pile {

    position:
        relative;

    width:
        82px;

    height:
        112px;

    cursor:
        pointer;
}

.back-card {

    position:
        absolute;

    width:
        75px;

    height:
        105px;

    border:
        4px solid white;

    border-radius:
        13px;

    background:
        linear-gradient(
            135deg,
            #252525,
            #756964
        );

    box-shadow:
        0 7px 15px #0008;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}

.back-card:nth-child(1) {

    transform:
        rotate(7deg)
        translate(10px,8px);
}

.back-card:nth-child(2) {

    transform:
        rotate(-5deg)
        translate(6px,4px);
}

.back-card.main {

    transform:
        none;

    z-index:
        5;

    transition:
        .2s;
}

.draw-pile:hover
.back-card.main {

    transform:
        translateY(-10px)
        rotate(-3deg);
}

.back-card span {

    font-size:
        20px;

    font-weight:
        1000;

    color:
        #ddd;

    transform:
        rotate(-90deg);
}

/* =====================================================
   GAME CARDS
===================================================== */

.card {

    width:
        75px;

    height:
        108px;

    border:
        4px solid white;

    border-radius:
        14px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        30px;

    font-weight:
        1000;

    box-shadow:
        0 8px 18px #0008,
        inset 0 0 10px #fff5;

    cursor:
        pointer;

    transition:
        transform .18s,
        filter .18s;
}

.card:hover {

    transform:
        translateY(-25px)
        scale(1.08)
        rotate(0deg) !important;

    filter:
        brightness(1.15);

    z-index:
        999;
}

.red {

    background:
        #ef3e3e;
}

.yellow {

    background:
        #fbc02d;

    color:
        #18100a;
}

.green {

    background:
        #3da34a;
}

.blue {

    background:
        #1e83d8;
}

.wild {

    background:
        conic-gradient(
            #ef3e3e,
            #fbc02d,
            #3da34a,
            #1e83d8,
            #ef3e3e
        );
}

/* =====================================================
   PLAYER HAND
===================================================== */

.my-hand {

    display:
        flex;

    justify-content:
        center;

    width:
        100vw;

    padding:
        0 12px;

    margin-bottom:
        5px;
}

.my-hand .card {

    margin-left:
        -17px;

    transform-origin:
        bottom center;
}

.my-hand .card:first-child {

    margin-left:
        0;
}

/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions {

    display:
        flex;

    gap:
        10px;

    margin-top:
        8px;
}

.game-btn {

    border:
        none;

    padding:
        10px 20px;

    border-radius:
        30px;

    font-weight:
        1000;

    cursor:
        pointer;

    box-shadow:
        0 7px 20px #0007;

    transition:
        .2s;
}

.game-btn:active {

    transform:
        scale(.9);
}

.draw-btn {

    background:
        white;

    color:
        #4b1d12;
}

.uno-btn {

    background:
        #ffdf00;

    color:
        #6d160d;

    animation:
        unoPulse 1.8s infinite;
}

@keyframes unoPulse {

    0%,
    100% {
        box-shadow:
            0 0 0 0
            rgba(255,223,0,.4);
    }

    50% {
        box-shadow:
            0 0 0 12px
            rgba(255,223,0,0);
    }
}

/* =====================================================
   TURN INDICATOR
===================================================== */

.turn-indicator {

    position:
        absolute;

    left:
        50%;

    top:
        31%;

    transform:
        translateX(-50%);

    padding:
        8px 20px;

    border-radius:
        30px;

    background:
        rgba(0,0,0,.4);

    color:
        #ffdf00;

    font-size:
        13px;

    font-weight:
        1000;

    z-index:
        30;
}

/* =====================================================
   ATTACK EFFECT
===================================================== */

.attack-text {

    position:
        fixed;

    left:
        50%;

    top:
        45%;

    transform:
        translate(-50%,-50%);

    font-size:
        90px;

    font-weight:
        1000;

    color:
        #ffdf00;

    text-shadow:
        5px 5px 0 #d00000,
        0 0 30px #ff4500;

    z-index:
        100000;

    animation:
        attackPop .9s ease forwards;

    pointer-events:
        none;
}

@keyframes attackPop {

    0% {

        transform:
            translate(-50%,-50%)
            scale(.2)
            rotate(-15deg);

        opacity:
            0;
    }

    40% {

        transform:
            translate(-50%,-50%)
            scale(1.3)
            rotate(5deg);

        opacity:
            1;
    }

    100% {

        transform:
            translate(-50%,-130%)
            scale(1);

        opacity:
            0;
    }
}

.shake {

    animation:
        shake .45s ease;
}

@keyframes shake {

    0% { transform: translate(0); }

    20% { transform: translate(-8px,5px); }

    40% { transform: translate(8px,-5px); }

    60% { transform: translate(-6px,-3px); }

    80% { transform: translate(6px,3px); }

    100% { transform: translate(0); }
}

/* =====================================================
   WINNER
===================================================== */

.winner {

    position:
        fixed;

    inset:
        0;

    z-index:
        999999;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(10px);
}

.winner-box {

    text-align:
        center;

    padding:
        45px;

    border-radius:
        30px;

    background:
        linear-gradient(
            145deg,
            #702b1b,
            #a64c2d
        );

    border:
        2px solid
        #ffae8b;

    box-shadow:
        0 30px 100px #000;

    animation:
        winnerIn .5s
        cubic-bezier(.2,1.5,.4,1);
}

.crown {

    font-size:
        75px;
}

.winner-title {

    font-size:
        45px;

    font-weight:
        1000;

    color:
        #ffdf00;
}

.winner-name {

    margin:
        10px 0 25px;

    font-size:
        28px;

    font-weight:
        900;
}

@keyframes winnerIn {

    from {

        transform:
            scale(.4)
            rotate(-5deg);

        opacity:
            0;
    }

    to {

        transform:
            scale(1);

        opacity:
            1;
    }
}

/* =====================================================
   TOAST
===================================================== */

#toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        20px;

    transform:
        translateX(-50%);

    z-index:
        999999;

    padding:
        12px 20px;

    border-radius:
        30px;

    background:
        #111827;

    border:
        1px solid
        #ffffff25;

    display:
        none;

    white-space:
        nowrap;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .table-center {

        width:
            74vw;

        height:
            74vw;
    }

    .card {

        width:
            62px;

        height:
            90px;

        font-size:
            25px;
    }

    .my-hand .card {

        margin-left:
            -21px;
    }

    .player-name {

        font-size:
            15px;

        padding:
            8px 17px;
    }

    .enemy-card {

        width:
            40px;

        height:
            58px;
    }

    .piles {

        gap:
            12px;
    }

    .draw-pile,
    .discard-pile {

        transform:
            scale(.85);
    }

    .round-btn {

        width:
            50px;

        height:
            50px;

        font-size:
            32px;
    }

    .game-title b {

        font-size:
            22px;
    }

    .players {

        grid-template-columns:
            repeat(2,1fr);
    }
}

</style>

</head>

<body>

<!-- =====================================================
     HOME
===================================================== -->

<section id="home">

    <div class="home-box">

        <div class="logo">
            UNO
        </div>

        <div class="no-mercy">
            NO MERCY
        </div>

        <div class="asif-edition">
            ASIF M EDITION • PLAY WITH YOUR HOMIES
        </div>

        <div class="home-buttons">

            <button
                class="main-btn"
                onclick="createRoom()"
            >
                CREATE ROOM
            </button>

            <button
                class="main-btn secondary-btn"
                onclick="showJoin()"
            >
                JOIN ROOM
            </button>

        </div>

        <div
            id="joinArea"
            class="join-area"
        >

            <input
                id="roomInput"
                maxlength="5"
                placeholder="ENTER ROOM CODE"
            >

            <button
                class="main-btn"
                style="margin-top:10px"
                onclick="joinRoom()"
            >
                JOIN NOW
            </button>

        </div>

        <footer>
            Created by ASIF MOZUMDER • 2026
        </footer>

    </div>

</section>

<!-- =====================================================
     NAME MODAL
===================================================== -->

<div
    id="nameModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            ENTER PLAYER NAME
        </h2>

        <p>
            This name will be visible
            to your homies.
        </p>

        <input
            id="nameInput"
            maxlength="20"
            placeholder="e.g. Asif"
        >

        <button
            class="main-btn"
            onclick="saveName()"
        >
            CONTINUE
        </button>

    </div>

</div>

<!-- =====================================================
     LOBBY
===================================================== -->

<section
    id="lobby"
    style="display:none"
>

    <div class="lobby-box">

        <div>
            ROOM CODE
        </div>

        <div
            id="roomCode"
            class="room-code"
        >
            -----
        </div>

        <div>
            Share this code with your friends.
        </div>

        <div
            id="players"
            class="players"
        >
        </div>

        <button
            id="startButton"
            class="main-btn"
            onclick="startGame()"
        >
            START GAME
        </button>

    </div>

</section>

<!-- =====================================================
     GAME
===================================================== -->

<section
    id="game"
    style="display:none"
>

    <div class="game-topbar">

        <button
            class="round-btn"
            onclick="location.reload()"
        >
            ‹
        </button>

        <div class="game-title">

            <b>
                UNO
            </b>

            <span>
                NO MERCY • ASIF M EDITION
            </span>

        </div>

        <button
            class="round-btn"
            onclick="location.reload()"
        >
            ↻
        </button>

    </div>

    <div class="table">

        <!-- TOP PLAYER -->

        <div
            id="topPlayer"
            class="player player-top"
        >

            <div
                id="topName"
                class="player-name"
            >
                Player
            </div>

            <div
                id="topHand"
                class="enemy-hand"
            >
            </div>

        </div>

        <!-- LEFT -->

        <div
            id="leftPlayer"
            class="player player-left"
        >

            <div
                id="leftName"
                class="player-name"
            >
                Player
            </div>

        </div>

        <!-- RIGHT -->

        <div
            id="rightPlayer"
            class="player player-right"
        >

            <div
                id="rightName"
                class="player-name"
            >
                Player
            </div>

        </div>

        <!-- CENTER TABLE -->

        <div class="table-center">

            <div class="turn-ring"></div>

            <div
                id="turnIndicator"
                class="turn-indicator"
            >
                WAITING
            </div>

            <div class="piles">

                <!-- DRAW -->

                <div
                    class="draw-pile"
                    onclick="drawCard()"
                >

                    <div class="back-card"></div>

                    <div class="back-card"></div>

                    <div class="back-card main">

                        <span>
                            UNO
                        </span>

                    </div>

                </div>

                <!-- DISCARD -->

                <div
                    id="discardPile"
                    class="discard-pile"
                >
                </div>

            </div>

        </div>

        <!-- YOU -->

        <div
            class="player player-you"
        >

            <div class="you-text">
                YOU
            </div>

            <div
                id="hand"
                class="my-hand"
            >
            </div>

            <div class="actions">

                <button
                    class="game-btn draw-btn"
                    onclick="drawCard()"
                >
                    DRAW
                </button>

                <button
                    class="game-btn uno-btn"
                    onclick="callUno()"
                >
                    UNO!
                </button>

            </div>

        </div>

    </div>

</section>

<div id="toast"></div>

<script>

/* =====================================================
   VARIABLES
===================================================== */

let socket = null;

let playerName = "";

let pendingAction = null;

let currentState = null;

let connectTimeout = null;

let lastTopCard = null;


/* =====================================================
   ELEMENT
===================================================== */

const $ =
    id =>
        document.getElementById(id);


/* =====================================================
   TOAST
===================================================== */

function toast(message) {

    const box =
        $("toast");

    box.textContent =
        message;

    box.style.display =
        "block";

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(() => {

            box.style.display =
                "none";

        }, 3000);
}


/* =====================================================
   NAME
===================================================== */

function saveName() {

    const name =
        $("nameInput")
        .value
        .trim();

    if (!name) {

        toast(
            "Please enter your name."
        );

        return;
    }

    playerName =
        name.substring(0,20);

    localStorage.setItem(
        "unoPlayerName",
        playerName
    );

    $("nameModal")
        .classList
        .add("hidden");

    if (
        pendingAction === "create"
    ) {

        connect({
            type:
                "create",

            name:
                playerName
        });

    }

    if (
        pendingAction === "join"
    ) {

        const code =
            $("roomInput")
            .value
            .trim()
            .toUpperCase();

        if (code.length !== 5) {

            toast(
                "Enter 5-character room code."
            );

            return;
        }

        connect({

            type:
                "join",

            name:
                playerName,

            code:
                code
        });
    }
}


/* =====================================================
   LOAD NAME
===================================================== */

const savedName =
    localStorage.getItem(
        "unoPlayerName"
    );

if (savedName) {

    $("nameInput").value =
        savedName;
}


/* =====================================================
   SHOW JOIN
===================================================== */

function showJoin() {

    $("joinArea")
        .classList
        .add("show");

    $("roomInput").focus();
}


/* =====================================================
   CREATE
===================================================== */

function createRoom() {

    pendingAction =
        "create";

    if (!playerName) {

        $("nameModal")
            .classList
            .remove("hidden");

        $("nameInput").focus();

        return;
    }

    connect({

        type:
            "create",

        name:
            playerName
    });
}


/* =====================================================
   JOIN
===================================================== */

function joinRoom() {

    const code =
        $("roomInput")
        .value
        .trim()
        .toUpperCase();

    if (code.length !== 5) {

        toast(
            "Enter 5-character room code."
        );

        return;
    }

    pendingAction =
        "join";

    if (!playerName) {

        $("nameModal")
            .classList
            .remove("hidden");

        $("nameInput").focus();

        return;
    }

    connect({

        type:
            "join",

        name:
            playerName,

        code:
            code
    });
}


/* =====================================================
   CONNECT
===================================================== */

function connect(data) {

    if (
        socket &&
        socket.readyState === WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );

        return;
    }

    toast(
        "Connecting to game server..."
    );

    try {

        const protocol =
            location.protocol === "https:"
                ? "wss"
                : "ws";

        socket =
            new WebSocket(
                protocol +
                "://" +
                location.host +
                "/ws"
            );

    } catch (error) {

        toast(
            "Could not connect."
        );

        return;
    }

    clearTimeout(
        connectTimeout
    );

    connectTimeout =
        setTimeout(() => {

            if (
                socket &&
                socket.readyState !==
                WebSocket.OPEN
            ) {

                try {
                    socket.close();
                } catch {}

                toast(
                    "Server is taking too long."
                );
            }

        }, 12000);


    /* OPEN */

    socket.onopen = () => {

        clearTimeout(
            connectTimeout
        );

        socket.send(
            JSON.stringify(data)
        );

        toast(
            "Connected!"
        );
    };


    /* MESSAGE */

    socket.onmessage =
        event => {

            let message;

            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }

            handleMessage(
                message
            );
        };


    /* ERROR */

    socket.onerror = () => {

        toast(
            "Connection error. Try again."
        );
    };


    /* CLOSE */

    socket.onclose = () => {

        clearTimeout(
            connectTimeout
        );

        toast(
            "Connection closed."
        );
    };
}


/* =====================================================
   MESSAGE
===================================================== */

function handleMessage(message) {

    /* ERROR */

    if (
        message.type === "error"
    ) {

        toast(
            message.message
        );

        return;
    }


    /* JOINED */

    if (
        message.type === "joined"
    ) {

        $("home")
            .style
            .display =
            "none";

        $("lobby")
            .style
            .display =
            "flex";

        $("roomCode")
            .textContent =
            message.room;

        return;
    }


    /* STATE */

    if (
        message.type === "state"
    ) {

        currentState =
            message;

        renderState();

        return;
    }
}


/* =====================================================
   RENDER STATE
===================================================== */

function renderState() {

    if (!currentState)
        return;


    /* LOBBY */

    if (!currentState.started) {

        $("game")
            .style
            .display =
            "none";

        $("lobby")
            .style
            .display =
            "flex";

        $("roomCode")
            .textContent =
            currentState.room;

        renderLobby();

        if (
            currentState.winner
        ) {

            setTimeout(() => {

                showWinner(
                    currentState.winner
                );

            }, 300);

        }

        return;
    }


    /* GAME */

    $("lobby")
        .style
        .display =
        "none";

    $("game")
        .style
        .display =
        "block";

    renderPlayers();

    renderTopCard();

    renderHand();

    renderTurn();

    detectSpecialCard();
}


/* =====================================================
   LOBBY
===================================================== */

function renderLobby() {

    const container =
        $("players");

    container.innerHTML = "";

    currentState.players
        .forEach(player => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "player-box";

            if (
                player.id ===
                currentState.hostId
            ) {

                div.classList.add(
                    "host"
                );
            }

            div.innerHTML = `

                <strong>
                    ${escapeHTML(player.name)}
                </strong>

                <br>

                <small>
                    ${player.count} cards
                </small>

                ${
                    player.id ===
                    currentState.hostId
                    ? "<br>👑 HOST"
                    : ""
                }

            `;

            container.appendChild(
                div
            );
        });


    $("startButton")
        .style
        .display =
        currentState.you ===
        currentState.hostId
            ? "block"
            : "none";
}


/* =====================================================
   PLAYERS
===================================================== */

function renderPlayers() {

    const players =
        currentState.players;

    const me =
        players.findIndex(
            p =>
                p.id ===
                currentState.you
        );

    if (me === -1)
        return;


    const total =
        players.length;


    /* Clear */

    $("topName")
        .textContent =
        "";

    $("leftName")
        .textContent =
        "";

    $("rightName")
        .textContent =
        "";


    /* Other players */

    const others =
        [];

    for (let i = 0; i < total; i++) {

        if (i !== me)
            others.push(
                players[i]
            );
    }


    if (others[0]) {

        $("topName")
            .textContent =
            others[0].name;

        createEnemyCards(
            "topHand",
            others[0].count
        );
    }

    if (others[1]) {

        $("leftName")
            .textContent =
            others[1].name;
    }

    if (others[2]) {

        $("rightName")
            .textContent =
            others[2].name;
    }
}


/* =====================================================
   ENEMY CARDS
===================================================== */

function createEnemyCards(
    id,
    count
) {

    const box =
        $(id);

    box.innerHTML = "";

    const visible =
        Math.min(
            count,
            8
        );

    for (
        let i = 0;
        i < visible;
        i++
    ) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "enemy-card";

        card.style.transform =
            `rotate(${(
                i -
                (visible - 1) / 2
            ) * 4}deg)`;

        box.appendChild(
            card
        );
    }
}


/* =====================================================
   TOP CARD
===================================================== */

function renderTopCard() {

    const box =
        $("discardPile");

    box.innerHTML = "";

    const card =
        currentState.topCard;

    if (!card)
        return;

    const div =
        createCardElement(
            card,
            false
        );

    div.style.position =
        "absolute";

    div.style.left =
        "0";

    div.style.top =
        "0";

    box.appendChild(
        div
    );
}


/* =====================================================
   HAND
===================================================== */

function renderHand() {

    const hand =
        $("hand");

    hand.innerHTML = "";

    currentState.hand
        .forEach((card,index) => {

            const div =
                createCardElement(
                    card,
                    true
                );

            const middle =
                (
                    currentState.hand.length -
                    1
                ) / 2;

            const distance =
                index -
                middle;

            const rotation =
                distance * 4;

            const vertical =
                Math.abs(distance) * 2;

            div.style.transform =
                `
                translateY(${vertical}px)
                rotate(${rotation}deg)
                `;

            div.style.zIndex =
                index;

            hand.appendChild(
                div
            );
        });
}


/* =====================================================
   CREATE CARD
===================================================== */

function createCardElement(
    card,
    clickable
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "card " +
        card.color;

    div.textContent =
        cardLabel(
            card.value
        );

    if (clickable) {

        div.onclick =
            () =>
                playCard(
                    card,
                    div
                );
    }

    return div;
}


/* =====================================================
   CARD LABEL
===================================================== */

function cardLabel(value) {

    const labels = {

        skip:
            "⊘",

        reverse:
            "↻",

        draw2:
            "+2",

        draw4:
            "+4",

        wild:
            "WILD"
    };

    return (
        labels[value] ||
        value
    );
}


/* =====================================================
   TURN
===================================================== */

function renderTurn() {

    const current =
        currentState.players[
            currentState.currentPlayer
        ];

    if (!current)
        return;

    if (
        current.id ===
        currentState.you
    ) {

        $("turnIndicator")
            .textContent =
            "🔥 YOUR TURN";

        $("turnIndicator")
            .style
            .color =
            "#ffdf00";

    } else {

        $("turnIndicator")
            .textContent =
            "TURN: " +
            current.name;

        $("turnIndicator")
            .style
            .color =
            "#fff";
    }
}


/* =====================================================
   DRAW
===================================================== */

function drawCard() {

    send({
        type:
            "draw"
    });
}


/* =====================================================
   PLAY CARD
===================================================== */

function playCard(
    card,
    element
) {

    const current =
        currentState.players[
            currentState.currentPlayer
        ];

    if (
        !current ||
        current.id !==
        currentState.you
    ) {

        toast(
            "Wait for your turn."
        );

        return;
    }


    /* WILD */

    if (
        card.color ===
        "wild"
    ) {

        const color =
            prompt(
                "Choose color:\nred / yellow / green / blue",
                "red"
            );

        if (
            ![
                "red",
                "yellow",
                "green",
                "blue"
            ].includes(
                String(color)
                .toLowerCase()
            )
        ) {

            toast(
                "Invalid color."
            );

            return;
        }

        flyCard(
            element,
            () => {

                send({

                    type:
                        "play",

                    cardId:
                        card.id,

                    color:
                        String(color)
                        .toLowerCase()
                });
            }
        );

        return;
    }


    /* NORMAL */

    flyCard(
        element,
        () => {

            send({

                type:
                    "play",

                cardId:
                    card.id
            });
        }
    );
}


/* =====================================================
   FLYING CARD
===================================================== */

function flyCard(
    element,
    callback
) {

    const start =
        element.getBoundingClientRect();

    const target =
        $("discardPile")
        .getBoundingClientRect();

    const flying =
        element.cloneNode(true);

    flying.style.position =
        "fixed";

    flying.style.left =
        start.left + "px";

    flying.style.top =
        start.top + "px";

    flying.style.width =
        start.width + "px";

    flying.style.height =
        start.height + "px";

    flying.style.margin =
        "0";

    flying.style.zIndex =
        "999999";

    document.body.appendChild(
        flying
    );

    const dx =
        target.left -
        start.left;

    const dy =
        target.top -
        start.top;

    requestAnimationFrame(() => {

        flying.style.transition =
            "transform .55s cubic-bezier(.2,.8,.2,1), opacity .55s";

        flying.style.transform =
            `
            translate(${dx}px,${dy}px)
            rotate(360deg)
            scale(.8)
            `;

        flying.style.opacity =
            ".2";
    });

    setTimeout(() => {

        flying.remove();

        if (callback)
            callback();

    }, 550);
}


/* =====================================================
   SPECIAL EFFECT
===================================================== */

function detectSpecialCard() {

    const card =
        currentState.topCard;

    if (!card)
        return;

    if (
        card.id ===
        lastTopCard
    )
        return;

    lastTopCard =
        card.id;

    if (
        card.value ===
        "draw4"
    ) {

        attackEffect(
            "+4"
        );
    }

    if (
        card.value ===
        "draw2"
    ) {

        attackEffect(
            "+2"
        );
    }
}


/* =====================================================
   ATTACK EFFECT
===================================================== */

function attackEffect(text) {

    document.body
        .classList
        .add("shake");

    setTimeout(() => {

        document.body
            .classList
            .remove("shake");

    },450);

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "attack-text";

    div.textContent =
        text;

    document.body.appendChild(
        div
    );

    setTimeout(() => {

        div.remove();

    },900);
}


/* =====================================================
   UNO
===================================================== */

function callUno() {

    toast(
        "UNO! 🔥"
    );

    document.body
        .classList
        .add("shake");

    setTimeout(() => {

        document.body
            .classList
            .remove("shake");

    },300);
}


/* =====================================================
   START
===================================================== */

function startGame() {

    send({
        type:
            "start"
    });
}


/* =====================================================
   SEND
===================================================== */

function send(data) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        toast(
            "Not connected."
        );

        return;
    }

    socket.send(
        JSON.stringify(data)
    );
}


/* =====================================================
   WINNER
===================================================== */

function showWinner(name) {

    if (
        document.querySelector(
            ".winner"
        )
    )
        return;

    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "winner";

    overlay.innerHTML = `

        <div class="winner-box">

            <div class="crown">
                👑
            </div>

            <div class="winner-title">
                WINNER!
            </div>

            <div class="winner-name">
                ${escapeHTML(name)}
            </div>

            <button
                class="main-btn"
                onclick="location.reload()"
            >
                PLAY AGAIN
            </button>

        </div>
    `;

    document.body.appendChild(
        overlay
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(
            /[&<>"']/g,
            char => ({

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#039;"

            })[char]
        );
}


/* =====================================================
   ENTER KEY
===================================================== */

$("nameInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                saveName();
            }
        }
    );


$("roomInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                joinRoom();
            }
        }
    );


/* =====================================================
   HIDE NAME MODAL
===================================================== */

$("nameModal")
    .classList
    .add("hidden");

</script>

</body>
</html>
